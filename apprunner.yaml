# ==============================================================================

version: 1.0
runtime: python312

build:
  commands:
    build:
      - pip install -r requirements.txt

run:
  command: uvicorn app.main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
  env:
    - name: PORT
      value: "8080"
    - name: ENABLE_RATE_LIMIT
      value: "true"
    - name: RATE_LIMIT_PER_HOUR
      value: "5"
